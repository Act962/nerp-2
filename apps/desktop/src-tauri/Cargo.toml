[package]
name = "nerp-desktop"
version = "0.1.0"
description = "NERP Caixa"
edition = "2021"

[lib]
name = "nerp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
